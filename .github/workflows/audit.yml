name: Audit

# Cargo.lock against the RustSec advisory database, with deny.toml's ignores.
# ci-cd.yml calls this when dependencies change. Advisories are also published
# against code that has not changed, so it runs against main every week too; the
# schedule lives here rather than in ci-cd.yml because a scheduled run there
# would reach the jobs that promote and deploy.
on:
  workflow_call:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        # rust as well: cargo-deny reads the lockfile through `cargo metadata`,
        # which should be the cargo mise.toml installs rather than the runner's.
        with:
          install_args: just rust cargo-deny
      - run: just audit
