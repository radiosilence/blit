name: CI/CD

# Two halves in one run, so CD ships the image CI built.
#
# CI checks the change and ends in `Checks`, the one status a ruleset
# should require. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails it.
# Jobs can therefore be added, renamed or skipped without touching branch
# protection.
#
# CD runs on main after `Checks` has passed: it tags the image CI pushed under
# the commit as `sha-<short>` and `latest`, then asks the deployment to pick it
# up. The site deploys by commit and has no versioned releases.
#
# Every step of substance is a Taskfile target that runs identically on a
# laptop; this file supplies the checkout, the toolchain, credentials and
# caches, and decides what runs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A pull request's newer push cancels its older run, and a newer push to main
# supersedes an older one: the next run's `changes` diffs against the last
# commit whose run passed, so nothing a cancelled run would have shipped is
# lost. A manual run is never cancelled.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || 'main' }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      site: ${{ steps.filter.outputs.site }}
      docker: ${{ steps.filter.outputs.docker }}
      base: ${{ steps.filter.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        # The domains a change touches, from its diff. A pull request's is
        # against its base. A push's is against the last commit on main whose
        # run passed, so a push whose run was cancelled by the next one still
        # reaches CD with it. When that commit cannot be found (no passed run in
        # the last two hundred commits, or `gh` failing), the base is unknown and
        # everything runs rather than guessing.
        # A manual run, or a diff that cannot be worked out, runs everything.
        #
        # Allowlists, so a new top-level directory is invisible here until it is
        # added below. Markdown is documentation except under src/, where the CV
        # is content.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          rust=true site=true docker=true
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            base=
            if passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty') && [ -n "$passed" ]; then
              # A re-run of the commit that last passed diffs against its parent.
              if [ "$passed" = "$(git rev-parse HEAD)" ]; then
                base=HEAD^1
              elif git fetch -q --deepen=200 origin main && git merge-base --is-ancestor "$passed" HEAD; then
                base=$passed
              fi
            fi
          fi
          touches() { grep -qE "$1" <<< "$relevant"; }
          if [ -n "$base" ] && [ "$EVENT" != "workflow_dispatch" ] && files=$(git diff --name-only "$base" HEAD); then
            echo "changes since $(git rev-parse --short "$base"):"
            printf '%s\n' "$files" | sed 's/^/  /'
            relevant=$(printf '%s\n' "$files" | awk '!/\.md$/ || /^src\//')
            # What cargo compiles, Askama's templates included, and the tasks
            # and toolchain that check it.
            touches '^(generator|crates)/|^Cargo\.(toml|lock)$|^askama\.toml$|^src/templates/|^Taskfile\.yml$|^mise\.toml$|^\.github/' || rust=false
            # Everything `task build` reads to write dist/.
            touches '^(generator|crates|src)/|^Cargo\.(toml|lock)$|^askama\.toml$|^Taskfile\.yml$|^mise\.toml$|^\.github/' || site=false
            # The image is dist/ on nano-web. A pull request builds it only when
            # the recipe changed (the Dockerfile, or the tasks and tools that
            # run it), since the site job already proves dist/ builds; main
            # whenever dist/ did, since CD ships it.
            if [ "$EVENT" = "pull_request" ] || [ "$site" = false ]; then
              touches '^Dockerfile$|^Taskfile\.yml$|^mise\.toml$|^\.github/' || docker=false
            fi
            # The image is built from dist/, so building it builds the site.
            if [ "$docker" = true ]; then
              site=true
            fi
          fi
          {
            echo "rust=$rust"
            echo "site=$site"
            echo "docker=$docker"
            echo "base=$(git rev-parse -q --verify "${base:-HEAD^1}^{commit}" || true)"
          } | tee -a "$GITHUB_OUTPUT"

  # Clippy, formatting and the tests, on the debug profile the tests use.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # mise.toml is the single source of truth for rust, task, tailwind and gh.
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      # rust-cache rather than a hand-rolled actions/cache: it keys on the rustc
      # version as well as Cargo.lock, and prunes target/ to what the build
      # references. Saved from main only, since a branch's cache is not readable
      # from other branches and would only evict the entry every PR restores.
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: task lint format:check test

  # CHANGELOG.md is generated from changelog.d/. A pull request adds fragments
  # without regenerating it, so only its fragments are checked; a change that
  # writes CHANGELOG.md must write exactly what the fragments make. The change
  # is the same diff `changes` read, so a push whose run was superseded is
  # still checked by the next. Every change carries a fragment, so this runs
  # for every change.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base can be any number of commits back; the history is small.
          fetch-depth: 0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: task
      - run: task changelog:check BASE=${{ needs.changes.outputs.base }}

  # The site, built once with the release profile. Generating it is a check in
  # its own right: an asset referenced by hand or a catalogue whose plural
  # forms disagree with CLDR fails here. The container job ships this dist/.
  site:
    name: Site
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: build
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: task build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
          # The image ships all of dist/, dotfiles included.
          include-hidden-files: true

  # dist/ on nano-web, for both architectures. A pull request builds it to
  # prove the recipe. Main pushes it under the full commit SHA in parallel with
  # the other checks; nothing deploys that tag, and CD moves the tags the
  # deployment reads onto it only once `Checks` has passed.
  container:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, site]
    if: ${{ !cancelled() && needs.changes.outputs.docker == 'true' && needs.site.result == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: task
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      # Keyed on the ref rather than the event, so a manual run on a branch
      # builds without publishing.
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # No layer cache: the image is a FROM, a LABEL and a COPY of dist/, whose
      # content changes on every build.
      - run: >-
          task docker:image
          SHA=${{ github.sha }}
          PUSH=${{ github.ref == 'refs/heads/main' }}

  # The one status a ruleset should require. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, rust, changelog, site, container]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key' | paste -sd ' ' -)
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`. `checks` runs whatever its needs did, so every
  # job here states the results it depends on rather than relying on the
  # default, which would skip it whenever any job upstream was skipped.

  # The deployment pins `sha-<short>` of main's head, so that tag exists only
  # once the commit has passed. Retagging copies no layers: what ships is the
  # image CI built.
  promote:
    name: Container image (promote)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [checks, container]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.container.result == 'success' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: task gh
      # No buildx builder: `imagetools create` talks to the registry alone.
      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - env:
          GH_TOKEN: ${{ github.token }}
        run: task docker:promote SHA=${{ github.sha }}

  update-deployment:
    name: Update deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: promote
    if: ${{ !cancelled() && needs.promote.result == 'success' }}
    # Serialised, and a superseded run cancelled rather than queued: two of
    # these would ask the deployment to update twice for the same head, and the
    # second answer would be the same as the first.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install_args: task gh
      # No git identity and no credential helper: this triggers a workflow, it
      # does not commit. DEPLOYMENT_PAT needs `actions: write` on the deployment
      # repository.
      - name: Ask the deployment to pick this up
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DEPLOYMENT_PAT is not set; the deployment picks the image up at its next scheduled sweep"
            exit 0
          fi
          task deploy:update
