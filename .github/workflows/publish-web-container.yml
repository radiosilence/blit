name: Build and Deploy Blit

# Every step is a Dagger function, so anything here can be reproduced locally
# with the same command. Keep this file thin — logic belongs in dagger/src.

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Traces every call below to Dagger Cloud, including the ones that fail.
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # mise.toml is the single source of truth for node, aube and dagger.
      - name: Install toolchain
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Check
        run: dagger call check

      - name: Build
        run: dagger call build

      # Publishes the image and points the deployment config at the new tag.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        run: |
          dagger call deploy \
            --sha=${{ github.sha }} \
            --ghcr-token=env://GITHUB_TOKEN \
            --deploy-token=env://DEPLOYMENT_PAT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_PAT: ${{ secrets.DEPLOYMENT_PAT }}
