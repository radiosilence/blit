name: Build and Deploy Blit

# Every step is a Dagger function, so anything here can be reproduced locally with
# the same call. Keep this file thin — logic belongs in dagger/src.
#
# The runner installs nothing but Dagger: node and aube live inside the build
# container, provisioned from mise.toml by the module itself.

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    # Traces every call below to Dagger Cloud, including the ones that fail.
    env:
      DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.7
          call: check
          enable-github-summary: true

      # deploy builds on its way to publishing, so this only earns its keep on a PR.
      - name: Build
        if: github.event_name == 'pull_request'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.7
          call: build

      # Publishes the image and points the deployment config at the new tag.
      - name: Deploy
        if: github.ref == 'refs/heads/main'
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.7
          call: >-
            deploy
            --sha=${{ github.sha }}
            --ghcr-token=env://GITHUB_TOKEN
            --deploy-token=env://DEPLOYMENT_PAT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_PAT: ${{ secrets.DEPLOYMENT_PAT }}
