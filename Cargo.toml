[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
# Sando.toml as constants and the published assets at run time. sando's
# release tag, from git until its crates are on crates.io; mise.toml pins sdo
# to the same release.
sando = { git = "https://github.com/radiosilence/sando", tag = "v0.1.0", default-features = false }
askama = "0.16"
# From git until its first release reaches crates.io.
askama_gettext = { git = "https://github.com/radiosilence/askama-gettext", rev = "cdc658e8b18df7c46c9a7162c40541863d783042" }
