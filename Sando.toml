[site]
# Where the site is served, for the URLs that leave it: canonical links and the
# Open Graph image a link preview fetches.
origin = "https://blit.cc"

[app]
package = "blit"
bin = "blit"
ready = "/healthz"

[assets]
dir = "crates/blit/assets"
# Their URLs are a convention rather than ours: a browser asks for /favicon.ico
# when a page links no icon, and a crawler asks for /robots.txt. No link can
# carry a hash for them, so each is an entry below.
fixed = ["favicon.ico", "robots.txt"]

[prerender]
# The crawl starts at / and follows every internal link, so this lists only
# what is reached by address. Each locale's home is an address people type and
# search engines are told about, so it is published whether or not the locale
# picker links it. /{locale}/cv keeps the check that every route is reached:
# sdo cannot list the app's routes, so a route no link reaches would otherwise
# go unpublished without failing the build. /cv.pdf is rendered by the app and
# is a link handed to people and pasted into application forms.
entries = ["/{locale}/", "/{locale}/cv", "/favicon.ico", "/robots.txt", "/cv.pdf"]

# Tailwind resolves `@plugin "@tailwindcss/typography"` through node_modules
# beside the stylesheet, which `just build` links into place first.
[[steps]]
name = "tailwind"
build = "tailwindcss --input crates/blit/styles/app.css --output {assets}/style.css --minify"

[i18n]
source = "en-GB"
prefix = "except-source"
catalogues = "crates/blit/locales/{locale}/messages.po"
# `msgfmt` drops a fuzzy translation, and so does this site. Most arrive from
# the merge itself, which carries an old translation onto an English string
# that has changed: serving one renders a translation of a sentence that no
# longer exists, which is how `cv-2026.08` shipped as `cv-2025.01` in every
# locale. An untranslated string falls back to the English in the template,
# since the msgid is the English rather than a key.
fuzzy = "skip"
# In the order the language menu lists them.
locales = [
    "en-GB",
    "ar-EG",
    "ar-PS",
    "bn-BD",
    "bo-CN",
    "de-DE",
    "dv-MV",
    "el-GR",
    "fr-FR",
    "gu-IN",
    "hi-IN",
    "hy-AM",
    "it-IT",
    "ja-JP",
    "ka-GE",
    "km-KH",
    "kn-IN",
    "ko-KR",
    "lo-LA",
    "ml-IN",
    "mn-MN",
    "my-MM",
    "ne-NP",
    "nl-BE",
    "nl-NL",
    "or-IN",
    "pa-IN",
    "pl-PL",
    "si-LK",
    "ta-IN",
    "te-IN",
    "th-TH",
    "uk-UA",
    "vi-VN",
    "zh-CN",
    "zh-TW",
]

# CLDR's compiled data has no Tibetan names; these are its endonyms.
[i18n.overrides."bo-CN"]
name = "བོད་སྐད་"
place = "རྒྱ་ནག"

# Nor Divehi. The names stay in English, as blit has always shown them; its
# direction still comes from CLDR.
[i18n.overrides."dv-MV"]
name = "Divehi"
place = "Maldives"
