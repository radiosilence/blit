version: "3"

vars:
  DIST: dist
  BIN: ./node_modules/.bin
  IMAGE: ghcr.io/radiosilence/blit
  PLATFORMS: linux/amd64
  # CI passes the commit explicitly; on a pull_request the checked-out HEAD is a
  # merge commit that nothing downstream knows about.
  SHA:
    sh: git rev-parse HEAD
  TAG: sha-{{trunc 7 .SHA}}

tasks:
  default:
    cmd: task --list
    silent: true

  install:
    internal: true
    run: once
    # Both guards are needed: sources catch a changed manifest, status catches a
    # deleted node_modules (which no fingerprint would notice).
    sources:
      - package.json
      - aube-lock.yaml
    status:
      - test -d node_modules
    cmd: aube install {{if .CI}}--frozen-lockfile{{end}}

  build:
    desc: Generate the whole site into dist/
    deps: [generate, static]

  # Depends on css because it fingerprints the compiled stylesheet into the URL.
  generate:
    desc: Render every locale × page to dist/
    deps: [install, css]
    sources:
      - scripts/generate.ts
      - src/content/**/*.md
      - src/i18n/**/*.ts
      - src/locales/**/*.po
      - src/templates/**/*.html
      - "{{.DIST}}/style.css"
    generates:
      - "{{.DIST}}/**/index.html"
    cmd: node scripts/generate.ts

  css:
    desc: Compile Tailwind
    deps: [install]
    run: once
    sources:
      - src/styles/**/*.css
      - src/templates/**/*.html
    generates:
      - "{{.DIST}}/style.css"
    cmd: "{{.BIN}}/tailwindcss --input src/styles/app.css --output {{.DIST}}/style.css --minify"

  # Deliberately unfingerprinted: the outputs are a whole directory rather than one
  # named file, so a partially-deleted dist/ can't be detected. Copying ~1 MB takes
  # a few ms, which is cheaper than the class of bug where assets silently vanish.
  static:
    desc: Copy fonts, icons and manifest
    cmds:
      - mkdir -p {{.DIST}}
      - cp -R src/static/. {{.DIST}}/

  dev:
    desc: Rebuild on change, serve on :3000
    deps: [watch, serve]

  watch:
    internal: true
    cmd: task --watch build

  serve:
    internal: true
    cmd: node scripts/serve.ts {{.DIST}} 3000

  clean:
    desc: Remove generated output
    # .task holds the source checksums; leaving it makes the next build skip
    # steps whose output was just deleted.
    cmd: rm -rf {{.DIST}} .task

  lint:
    desc: Lint with oxlint
    deps: [install]
    cmd: "{{.BIN}}/oxlint {{.CLI_ARGS}}"

  format:
    desc: Format with oxfmt
    deps: [install]
    cmd: "{{.BIN}}/oxfmt --write {{.CLI_ARGS}}"

  format:check:
    desc: Check formatting
    deps: [install]
    cmd: "{{.BIN}}/oxfmt --check"

  typecheck:
    desc: Typecheck with tsc
    deps: [install]
    cmd: "{{.BIN}}/tsc --noEmit"

  i18n:sync:
    desc: Propagate source-locale keys to every catalogue
    cmd: node scripts/sync-locales.ts

  check:
    desc: Lint, formatting and types
    deps: [lint, format:check, typecheck]

  ci:
    desc: Everything CI verifies — checks, then a full build
    cmds:
      - task: check
      - task: build

  # Cache flags come from the environment so the same command runs locally (buildx's
  # own cache) and on a runner (GitHub's). PUSH and LATEST are compared as strings
  # because GitHub expressions render booleans as "true"/"false".
  docker:build:
    desc: Build the container image — PUSH=true to push, LATEST=true to also tag latest
    deps: [build]
    cmd: >-
      docker buildx build .
      --platform {{.PLATFORMS}}
      --tag {{.IMAGE}}:{{.TAG}}
      {{if eq .LATEST "true"}}--tag {{.IMAGE}}:latest{{end}}
      {{if .CACHE_FROM}}--cache-from {{.CACHE_FROM}}{{end}}
      {{if .CACHE_TO}}--cache-to {{.CACHE_TO}}{{end}}
      {{if eq .PUSH "true"}}--push{{else}}--load{{end}}

  # Pushes to another repo, so it needs a git credential helper: `gh auth setup-git`
  # locally, GH_TOKEN plus the same command on a runner.
  deploy:update:
    desc: Point the jaritanet deployment at a container tag
    vars:
      DEPLOY_REPO: radiosilence/jaritanet
      DEPLOY_DIR: .deploy
      DEPLOY_CONFIG: packages/infra/Pulumi.main.yaml
      SERVICE: blit
      HTTP_PORT: 3000
    cmds:
      - rm -rf {{.DEPLOY_DIR}}
      - gh repo clone {{.DEPLOY_REPO}} {{.DEPLOY_DIR}} -- --depth 1
      - >-
        yq -i '.config."jaritanet:services"."{{.SERVICE}}".args |=
        (.image.tag = "{{.TAG}}" | .httpPort = {{.HTTP_PORT}})'
        {{.DEPLOY_DIR}}/{{.DEPLOY_CONFIG}}
      - |
        if git -C {{.DEPLOY_DIR}} diff --quiet; then
          echo "{{.SERVICE}} is already on {{.TAG}}"
        else
          git -C {{.DEPLOY_DIR}} commit -am "🚀 Update {{.SERVICE}} to {{.TAG}}"
          git -C {{.DEPLOY_DIR}} push
        fi
