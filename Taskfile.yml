version: "3"

vars:
  DIST: dist
  # Tailwind's output is an input to generate, which rewrites it; keeping it out of
  # dist gives that rewrite a fixed input and leaves dist owned by generate alone.
  BUILD: .build
  IMAGE: ghcr.io/radiosilence/blit
  # Both architectures come out of one build. Nothing in the image is
  # architecture-specific — dist/ is bytes and the base image is already a manifest
  # list — so there is no RUN for qemu to emulate and no second compile to parallelise.
  PLATFORMS: linux/amd64,linux/arm64
  # Debug builds compile several times faster, which is what the watch loop wants.
  # CI sets CI=true and gets an optimised binary.
  PROFILE: '{{if .CI}}--release{{end}}'

tasks:
  default:
    cmd: task --list
    silent: true

  build:
    desc: Generate the whole site into dist/
    deps: [generate]

  # Depends on css because it hashes the compiled stylesheet into its filename.
  generate:
    desc: Render every locale × page to dist/
    deps: [css]
    sources:
      - Cargo.toml
      - Cargo.lock
      - crates/**/*.rs
      - generator/**/*.rs
      - src/content/**/*.md
      - src/locales/**/*.po
      - src/static/**/*
      - src/templates/**/*.html
      - "{{.BUILD}}/style.css"
    generates:
      - "{{.DIST}}/**/index.html"
    cmd: cargo run {{.PROFILE}} --quiet --bin blit

  css:
    desc: Compile Tailwind
    run: once
    deps: [plugins]
    sources:
      - src/styles/**/*.css
      - src/templates/**/*.html
    generates:
      - "{{.BUILD}}/style.css"
    cmd: tailwindcss --input src/styles/app.css --output {{.BUILD}}/style.css --minify

  # Tailwind resolves `@plugin "@tailwindcss/typography"` through node_modules beside
  # the stylesheet, and the plugin is a mise tool rather than a project dependency.
  # A symlink lets the stylesheet keep saying what it means without a package.json.
  plugins:
    internal: true
    run: once
    status:
      - test -L node_modules
    cmd: ln -sfn "$(mise where npm:@tailwindcss/typography)/node_modules" node_modules

  dev:
    desc: Rebuild on change, serve on :3000
    deps: [watch, serve]

  watch:
    internal: true
    cmd: task --watch dev:build

  # Extraction is kept out of `build` because it writes to src/, and a CI build that
  # mutates its own input leaves a dirty tree. In dev that is exactly what you want:
  # edit a string, and every catalogue has it by the time the page reloads.
  #
  # This watches the catalogues it also writes, which settles rather than loops —
  # the second pass produces identical bytes, so the checksum stops matching a change.
  dev:build:
    desc: Sync catalogues then build — dev only, since it writes to src/
    sources:
      - crates/**/*.rs
      - generator/**/*.rs
      - src/content/**/*.md
      - src/locales/**/*.po
      - src/static/**/*
      - src/styles/**/*.css
      - src/templates/**/*.html
    cmds:
      - task: i18n:sync
      - task: build

  # The same server the image runs, so dev resolves URLs exactly as production does.
  # --dev drops the year-long caching it serves with, so a rebuild is picked up.
  #
  # Deliberately not in mise.toml: that pins what the build needs, and nothing in
  # `task build` or CI touches a server. Bring your own.
  serve:
    internal: true
    preconditions:
      - sh: command -v nano-web
        msg: |
          nano-web is not on PATH. It serves dist/ for `task dev` and is not part of
          the build toolchain, so it is not pinned in mise.toml.
          https://github.com/radiosilence/nano-web
    cmd: nano-web serve {{.DIST}} --port 3000 --dev

  clean:
    desc: Remove generated output
    # .task holds the source checksums; leaving it makes the next build skip steps
    # whose output was just deleted.
    cmd: rm -rf {{.DIST}} {{.BUILD}} .task target

  i18n:sync:
    desc: Extract messages from the templates into every catalogue
    cmd: cargo run --quiet --bin blit-i18n

  lint:
    desc: Lint with clippy
    cmd: cargo clippy --workspace --all-targets -- -D warnings

  format:
    desc: Format with rustfmt
    cmd: cargo fmt --all

  format:check:
    desc: Check formatting
    cmd: cargo fmt --all --check

  test:
    desc: Run the test suite
    cmd: cargo test --workspace

  check:
    desc: Lint, formatting and tests
    deps: [lint, format:check, test]

  ci:
    desc: Everything CI verifies — checks, then a full build
    cmds:
      - task: check
      - task: build

  # Cache flags are read from the environment so a caller can point buildx at a shared
  # cache; unset, it uses the local one. PUSH and LATEST are compared as strings
  # because GitHub expressions render booleans as "true"/"false".
  docker:build:
    desc: Build the container image — PUSH=true to push, LATEST=true to also tag latest
    deps: [build]
    # SHA is derived here rather than globally: Task evaluates global `sh:` vars on
    # every invocation, so `task lint` and the dev watch loop would fork git too. The
    # self-reference is load-bearing — a plain task-level var outranks a CLI-passed
    # one, which would silently discard the SHA= the caller supplied. CI supplies it
    # because on a pull_request the checked-out HEAD is a merge commit that nothing
    # downstream knows about.
    vars:
      SHA:
        sh: "{{if .SHA}}echo {{.SHA}}{{else}}git rev-parse HEAD{{end}}"
      TAG: sha-{{trunc 7 .SHA}}
      BUILT_AT:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    # --platform only applies to a push: a manifest list is a registry object, and
    # --load has nowhere to put one, so a local build takes the host's architecture —
    # which is the only one you could run anyway.
    cmd: >-
      docker buildx build .
      {{if eq .PUSH "true"}}--platform {{.PLATFORMS}}{{end}}
      --tag {{.IMAGE}}:{{.TAG}}
      {{if eq .LATEST "true"}}--tag {{.IMAGE}}:latest{{end}}
      --label org.opencontainers.image.revision={{.SHA}}
      --label org.opencontainers.image.created={{.BUILT_AT}}
      --label org.opencontainers.image.version={{.TAG}}
      {{if .CACHE_FROM}}--cache-from {{.CACHE_FROM}}{{end}}
      {{if .CACHE_TO}}--cache-to {{.CACHE_TO}}{{end}}
      {{if eq .PUSH "true"}}--push{{else}}--load{{end}}

  # Asks the deployment to update itself, rather than reaching in and editing it.
  #
  # This used to clone jaritanet and rewrite an image tag in its Pulumi config
  # with yq, which meant this repository had to know where that value lived. It
  # stopped living there the day that config became TypeScript, and the only
  # reason nothing shipped broken is that the task checked the path resolved
  # before writing.
  #
  # So the direction is inverted. This says a build exists; what a version is,
  # where the pin lives and how to write it belong to the deployment, which is
  # where they were always going to change. Its updater resolves this branch's
  # head to the tag `docker:build` pushed and moves the pin from there.
  #
  # GH_TOKEN needs `actions: write` on the deployment repository — it triggers a
  # workflow now rather than committing, so `contents: write` is no longer
  # wanted and should be removed from the token.
  deploy:update:
    desc: Ask the jaritanet deployment to pick up the newest build
    vars:
      DEPLOY_REPO: radiosilence/jaritanet
      DEPLOY_WORKFLOW: update-apps.yml
    cmds:
      - gh workflow run {{.DEPLOY_WORKFLOW}} --repo {{.DEPLOY_REPO}}
      - echo "asked {{.DEPLOY_REPO}} to update; it resolves this branch's head itself"
