version: "3"

vars:
  DIST: dist
  BIN: ./node_modules/.bin

tasks:
  default:
    cmd: task --list
    silent: true

  install:
    internal: true
    # Both guards are needed: sources catch a changed manifest, status catches a
    # deleted node_modules (which no fingerprint would notice).
    sources:
      - package.json
      - aube-lock.yaml
    status:
      - test -d node_modules
    cmd: aube install

  build:
    desc: Generate the whole site into dist/
    deps: [generate, static]

  # Depends on css because it fingerprints the compiled stylesheet into the URL.
  generate:
    desc: Render every locale × page to dist/
    deps: [install, css]
    sources:
      - scripts/generate.ts
      - src/content/**/*.md
      - src/i18n/**/*.ts
      - src/locales/**/*.po
      - src/templates/**/*.html
      - "{{.DIST}}/style.css"
    generates:
      - "{{.DIST}}/**/index.html"
    cmd: node scripts/generate.ts

  css:
    desc: Compile Tailwind
    deps: [install]
    sources:
      - src/styles/**/*.css
      - src/templates/**/*.html
    generates:
      - "{{.DIST}}/style.css"
    cmd: "{{.BIN}}/tailwindcss --input src/styles/app.css --output {{.DIST}}/style.css --minify"

  # Deliberately unfingerprinted: the outputs are a whole directory rather than one
  # named file, so a partially-deleted dist/ can't be detected. Copying ~1 MB takes
  # a few ms, which is cheaper than the class of bug where assets silently vanish.
  static:
    desc: Copy fonts, icons and manifest
    cmds:
      - mkdir -p {{.DIST}}
      - cp -R src/static/. {{.DIST}}/

  dev:
    desc: Rebuild on change, serve on :3000
    deps: [watch, serve]

  watch:
    internal: true
    cmd: task --watch build

  serve:
    internal: true
    cmd: node scripts/serve.ts {{.DIST}} 3000

  clean:
    desc: Remove generated output
    # .task holds the source checksums; leaving it makes the next build skip
    # steps whose output was just deleted.
    cmd: rm -rf {{.DIST}} .task

  lint:
    desc: Lint with oxlint
    deps: [install]
    cmd: "{{.BIN}}/oxlint {{.CLI_ARGS}}"

  format:
    desc: Format with oxfmt
    deps: [install]
    cmd: "{{.BIN}}/oxfmt --write {{.CLI_ARGS}}"

  format:check:
    desc: Check formatting
    deps: [install]
    cmd: "{{.BIN}}/oxfmt --check"

  typecheck:
    desc: Typecheck with tsc
    deps: [install]
    cmd: "{{.BIN}}/tsc --noEmit"

  i18n:sync:
    desc: Propagate source-locale keys to every catalogue
    cmd: node scripts/sync-locales.ts
