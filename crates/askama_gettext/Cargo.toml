[package]
name = "askama_gettext"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "gettext for Askama templates: __/__p/__n in the template, extraction via Askama's own parser, CLDR plural selection"
keywords = ["askama", "gettext", "i18n", "l10n", "template"]
categories = ["internationalization", "template-engine"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/radiosilence/blit"
readme = "README.md"

# Askama is not a dependency: the crate is what a template calls, and never calls
# it. Rendering one is how the tests check that, so it is needed only there.
[dev-dependencies]
askama = "0.16"

[dependencies]
askama_parser = "0.16"
icu_locale = "2"
icu_locale_core = "2"
icu_plurals = "2"
polib = "0.3"
thiserror = "2"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
