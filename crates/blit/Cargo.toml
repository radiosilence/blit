[package]
name = "blit"
version = "0.1.0"
edition = "2024"

[dependencies]
askama.workspace = true
askama_parser.workspace = true
askama_gettext = { path = "../askama_gettext" }
anyhow = "1"
sha2 = "0.11"
# Renders /cv and /cv.pdf in-process, so generate still writes all of dist/ and the
# build needs no second tool to have run first.
typst = "0.15"
typst-layout = "0.15"
typst-html = "0.15"
typst-pdf = "0.15"
walkdir = "2"
