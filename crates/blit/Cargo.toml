[package]
name = "blit"
version = "0.1.0"
edition = "2024"

[dependencies]
askama.workspace = true
askama_gettext.workspace = true
sando = { workspace = true, features = ["assets", "listener"] }
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "limit", "set-header", "timeout"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Renders /cv and /cv.pdf in-process, so serving and crawling need no second
# tool to have run first.
typst = "0.15"
typst-layout = "0.15"
typst-html = "0.15"
typst-pdf = "0.15"
walkdir = "2"

[dev-dependencies]
# The server's tests publish the assets as sdo does.
sando = { workspace = true, features = ["assets", "listener", "pipeline"] }
tempfile = "3.27"

[build-dependencies]
sando = { workspace = true, features = ["build"] }
