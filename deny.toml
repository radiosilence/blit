# `just audit` checks the lockfile against the RustSec advisory database. Only
# advisories are checked; licences and bans are not policies this site has.
#
# The CI job and the weekly scheduled run both read this file, so an ignore added
# here applies to both. Each one says why the advisory does not reach this build.
[advisories]
# Unmaintained crates are reported when a workspace crate depends on them
# directly. One pulled in by a dependency is that dependency's to replace, so it is
# not reported; a vulnerability in it still is.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38, reached through typst -> hayagriva -> citationberg: quadratic time on hostile XML. CvWorld in generator/cv.rs reads only files under src/, so the only XML typst can parse is what ships in this repository. Remove once typst moves to quick-xml 0.41." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38, as RUSTSEC-2026-0194: memory exhaustion from hostile namespace declarations, in XML that only this repository's src/ could supply." },
]
