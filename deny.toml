# `just audit` checks the lockfile against the RustSec advisory database. Only
# advisories are checked; licences and bans are not policies this site has.
#
# The CI job and the weekly scheduled run both read this file, so an ignore added
# here applies to both. Each one says why the advisory does not reach this build.
[advisories]
# Unmaintained crates are reported only when this workspace depends on them
# directly. Every one in the tree today arrives through typst or askama, and the
# fix for those is upstream; a vulnerability in one is still reported below.
unmaintained = "workspace"
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "quick-xml 0.38, reached through typst -> hayagriva -> citationberg. Quadratic time on hostile XML; typst only parses CSL styles bundled with it, and the CV cites nothing. Remove once typst moves to quick-xml 0.41." },
  { id = "RUSTSEC-2026-0195", reason = "quick-xml 0.38, as RUSTSEC-2026-0194: memory exhaustion from hostile namespace declarations in XML this build never reads." },
]
