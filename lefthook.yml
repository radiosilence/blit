pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs}"
      run: aube run lint:fix {staged_files}
      stage_fixed: true
    oxfmt:
      run: aube run format {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    typecheck:
      run: aube run typecheck
