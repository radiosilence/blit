pre-commit:
  parallel: true
  commands:
    oxlint:
      glob: "*.{ts,js,mjs,cjs}"
      run: task lint -- --fix {staged_files}
      stage_fixed: true
    oxfmt:
      run: task format -- {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
    typecheck:
      run: task typecheck
