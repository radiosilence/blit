[tools]
# The server and the extractor. `just check` runs rustfmt and clippy, which the
# minimal profile leaves out — a laptop tends to have them from rustup already, a
# clean runner does not.
rust = { version = "latest", components = "rustfmt,clippy" }
just = "latest"
# Rebuilds on change for `just dev`.
watchexec = "latest"
# Tailwind is the one part of the build that is still JavaScript — its compiler is
# TypeScript, and Oxide is only the scanner — so it arrives as a pinned tool rather
# than as a package manifest and a node_modules tree.
"npm:@tailwindcss/cli" = "4"
# The `prose` styles the CV uses. Tailwind resolves `@plugin` against node_modules
# next to the stylesheet, so `just build` links it into place from here.
"npm:@tailwindcss/typography" = "0.5"
# sdo builds the site (`just build`). Built from the commit Cargo.toml pins the
# sando library to, so the toolchain and the library cannot disagree; a release
# from github:radiosilence/sando once one is out.
"cargo:https://github.com/radiosilence/sando" = { version = "rev:5ea469565309527947818324ba62ff6bc6948b6c", crate = "sando-cli" }
# Used by the deploy recipe; pinned here so CI gets them from the same place as a laptop.
gh = "latest"
# Installs the pre-commit hook in lefthook.yml (`just hooks`).
lefthook = "latest"
# Checks Cargo.lock against RustSec advisories (`just audit`). A prebuilt binary,
# so a cold CI cache does not compile it.
cargo-deny = "0.20.2"
# Lints .github/workflows (`just check`); shellcheck checks the scripts in `run` steps.
actionlint = "1.7.12"
shellcheck = "0.11.0"
# Formats the askama templates (`just fmt`) and checks them in CI, as the editor does.
# Our own tool, so mise's wait before installing a new release is off: CI runs the
# release the editor runs.
"github:radiosilence/askama-analyzer" = { version = "latest", minimum_release_age = "0" }
