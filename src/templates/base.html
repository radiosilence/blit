<!doctype html>
<html lang="{{locale}}" dir="{{dir}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{t.tagline}}</title>

    <meta name="theme-color" content="#ffffff" />
    <meta name="application-name" content="blit.cc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="blit.cc" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="{{t.tagline}}" />
    <meta property="og:url" content="https://blit.cc{{path}}" />
    <meta property="og:image" content="https://blit.cc/logo.png" />

    <link rel="stylesheet" href="/style.css" />
    <link rel="preload" href="/geist-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    {{> content}}

    <nav class="fixed end-2 bottom-2 text-xs">
      <button type="button" id="locale-trigger" class="cursor-pointer p-1 underline">
        {{locale}}
      </button>
    </nav>

    <!-- Only the list scrolls; the dialog itself must not, or the UA adds a resize grip. -->
    <dialog
      id="locale-dialog"
      aria-labelledby="locale-heading"
      class="m-auto flex max-h-[80vh] w-[min(44rem,calc(100vw-2rem))] flex-col overflow-hidden border border-brand-mid/40 bg-white p-0 text-brand-dark backdrop:bg-black/60 backdrop:backdrop-blur-sm dark:bg-brand-surface dark:text-brand-light"
    >
      <header class="flex items-center justify-between border-b border-brand-mid/30 px-4 py-3">
        <h2 id="locale-heading" class="text-sm font-semibold normal-case">{{t.language}}</h2>
        <form method="dialog">
          <button
            class="flex size-8 cursor-pointer items-center justify-center text-xl leading-none opacity-70 hover:opacity-100"
            aria-label="{{t.close}}"
          >
            ×
          </button>
        </form>
      </header>

      <ul class="grid grid-cols-2 overflow-y-auto p-2 sm:grid-cols-3">
        {{#localeLinks}}
        <li>
          <a
            href="{{href}}"
            hreflang="{{code}}"
            lang="{{code}}"
            aria-current="{{current}}"
            class="block px-3 py-2 no-underline hover:bg-brand-mid/20 {{#current}}text-brand{{/current}}{{^current}}text-inherit{{/current}}"
          >
            <span class="block truncate text-sm">{{name}}</span>
            <span class="block truncate text-xs opacity-60">{{place}}</span>
          </a>
        </li>
        {{/localeLinks}}
      </ul>
    </dialog>

    <script>
      const dialog = document.getElementById("locale-dialog");
      document.getElementById("locale-trigger").onclick = () => {
        dialog.showModal();
        // Focusing the active locale scrolls it into view for free.
        dialog.querySelector('[aria-current="true"]').focus();
      };
      // <dialog> gives Esc and focus trapping; only click-outside needs wiring.
      dialog.onclick = (event) => {
        if (event.target === dialog) dialog.close();
      };
    </script>
  </body>
</html>
