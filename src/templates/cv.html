{% extends "page-base.html" %}
{% block content %}
{%- let logo = asset("logo.png") %}
{%- let pdf = asset("cv.pdf") %}
<div class="mx-4 flex flex-col items-center lg:mx-0">
  <section class="mb-12 max-w-5xl">
    <a href="{{ urls.home }}">
      <img src="{{ logo }}" alt="blit.cc logo" width="128" height="128" class="mt-16 mb-8 lg:mt-32" />
    </a>
    <article class="prose prose-sm" lang="en" dir="ltr">{{ cv|safe }}</article>
  </section>
</div>

{# Pinned like the locale switcher, so it never sits in the CV's own flow. #}
<a href="{{ pdf }}" class="fixed end-2 top-2 p-1 text-xs print:hidden">{{ __("download as pdf") }}</a>
{% endblock %}
