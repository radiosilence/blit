{% extends "page-base.html" %}
{% block content %}
{%- let logo = asset("logo.png") %}
{%- let pdf = asset("cv.pdf") %}
<div class="mx-4 flex flex-col items-center lg:mx-0">
  <section class="mb-12 max-w-5xl">
    <a href="{{ urls.home }}">
      <img src="{{ logo }}" alt="blit.cc logo" width="128" height="128" class="mt-16 mb-8 lg:mt-32" />
    </a>
    <p class="mb-8 text-xs print:hidden"><a href="{{ pdf }}">{{ __("download as pdf") }}</a></p>
    <article class="prose prose-sm">{{ cv|safe }}</article>
  </section>
</div>
{% endblock %}
